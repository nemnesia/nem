name: Java 25 Compatibility

'on':
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and unit test on Java 25
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build package
        run: mvn -B clean package -DskipTests

      - name: Run unit tests
        run: mvn -B test
