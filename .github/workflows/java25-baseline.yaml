name: Java 25 Production Baseline

'on':
  push:
    branches: [dev, main, agent/nis-phase0-baseline]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and unit test on Java 25 (primary runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Run clean unit tests
        run: mvn -B clean test

      - name: Package modules
        run: mvn -B -DskipTests package
